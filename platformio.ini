; PlatformIO Project Configuration File

; -------------------------------------------------------------------------
; 1. CẤU HÌNH CHUNG CHO TẤT CẢ CÁC ENVIRONMENT (Tránh lặp lại code)
; -------------------------------------------------------------------------
[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps = 
    adafruit/Adafruit Unified Sensor
    adafruit/Adafruit ADXL345
    mprograms/QMC5883LCompass @ ^1.2.3
    sandeepmistry/LoRa @ ^0.8.0

; -------------------------------------------------------------------------
; 2. ENVIRONMENT MẶC ĐỊNH (CHẠY CHƯƠNG TRÌNH CHÍNH MAIN.CPP)
; -------------------------------------------------------------------------
[env:esp32dev]
build_src_filter = +<main.cpp>

; -------------------------------------------------------------------------
; 3. ENVIRONMENT TEST CẢM BIẾN ĐỘ ẨM ĐẤT
; -------------------------------------------------------------------------
[env:test_soil]
build_src_filter = +<test_soil_moisture.cpp>